repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: trailing-whitespace
      exclude: ^secrets/
    - id: end-of-file-fixer
      exclude: ^secrets/
    - id: check-merge-conflict

- repo: https://github.com/crate-ci/typos
  rev: v1.32.0
  hooks:
    - id: typos
      exclude: ^secrets/

- repo: local
  hooks:
    - id: deadnix
      name: deadnix
      entry: deadnix --fail
      language: system
      types: [nix]

    - id: nixfmt
      name: nixfmt
      entry: nixfmt
      language: system
      types: [nix]

    - id: statix
      name: statix
      entry: statix check -i .direnv
      language: system
      types: [nix]
      pass_filenames: false

    - id: stylua
      name: stylua
      entry: stylua
      language: system
      types: [lua]

    - id: tofu-validate
      name: tofu validate
      entry: just tf validate
      language: system
      pass_filenames: false
      files: ^(modules|bases|targets)/terranix/
