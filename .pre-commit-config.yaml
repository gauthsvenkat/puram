default_install_hook_types: [pre-commit, commit-msg]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    - id: trailing-whitespace
      exclude: ^secrets/
    - id: end-of-file-fixer
      exclude: ^secrets/
    - id: check-merge-conflict

- repo: local
  hooks:
    - id: deadnix
      name: deadnix
      entry: deadnix --fail
      language: system
      types: [nix]

    - id: lychee
      name: lychee
      entry: lychee --offline --include-fragments --no-progress
      language: system
      types: [markdown]

    - id: nixfmt
      name: nixfmt
      entry: nixfmt
      language: system
      types: [nix]

    - id: statix
      name: statix
      entry: statix check -i .direnv
      language: system
      types: [nix]
      pass_filenames: false

    - id: stylua
      name: stylua
      entry: stylua
      language: system
      types: [lua]

    - id: tofu-validate
      name: tofu validate
      entry: just tf validate
      language: system
      pass_filenames: false
      files: ^(modules|bases|targets)/terranix/

    - id: author-identity
      name: author identity
      entry: >-
        sh -c 'id="Gautham Venkataraman <gauthsvenkat@gmail.com>";
        for v in GIT_AUTHOR_IDENT GIT_COMMITTER_IDENT; do
          [ "$(git var $v | sed "s/ [0-9]* [-+][0-9]*$//")" = "$id" ] || { echo "$v is not $id"; exit 1; };
        done;
        ! grep -qi "^co-authored-by:" "$1" || { echo "no Co-authored-by allowed"; exit 1; }' --
      language: system
      stages: [commit-msg]
      always_run: true
